 const st=`統率 ${o.lea}　武力 ${o.war}　智力 ${o.int}　政治 ${o.pol}　魅力 ${o.cha}`;
 const life=`${o.appear} 年登場${o.death?`　${o.death} 年前後卒`:''}　出身 ${o.home}${F?`　${F.name}軍`:o.fac===null?'　在野':''}`;
 return `<div class="bio"><div class="biohead">${portrait(o,96)}<div><h3>${o.name}</h3><p class="hint">${life}</p><p class="hint">${st}</p></div></div>`+
  (relationText(o).length?`<p class="hint">${relationText(o).join('　')}${skillText(o)?'　技能・'+skillText(o):''}</p>`:skillText(o)?`<p class="hint">技能・${skillText(o)}</p>`:'')+(b.z?`<p class="evt"><b class="src">志</b>${b.z}</p>`:'')+(b.y?`<p class="evt"><b class="src y">演</b>${b.y}</p>`:'')+(QUOTES[o.name]?`<p class="quote">${QUOTES[o.name]}</p>`:'')+(HUI[o.name]?`<p class="hint">演義回目：${HUI[o.name]}</p>`:'')+
  (!BIO[o.name]?'<p class="hint">這位人物尚未撰寫人物誌，以上為依名單資料生成的簡述。</p>':'<p class="hint">「志」為《三國志》所載史實，「演」為《三國演義》情節。</p>')+`</div>`;
}
function openBio(id){const o=S.officers[id];if(!o)return;stat('bioViews');checkAch();modal('人物誌',bioHTML(o),[{label:'關閉',primary:true}]);}
/* 人物加入玩家陣營時介紹一次（登場、登用、俘虜歸順、事件）。自動模擬中不介紹 */
function introduce(o,why){
 if(!S||SIM.on||o.fac!==S.player)return;
 S.intro=S.intro||{};if(S.intro[o.id])return;S.intro[o.id]=1;
 pushEvent(`${why||'人物登場'}：${o.name}`,bioHTML(o));
}
/* 點頭像（大地圖面板、人才一覽、圖鑑）開人物誌；戰場中不作用 */
document.addEventListener('click',e=>{const p=e.target.closest('.pt[data-o]');if(!p||BT)return;openBio(+p.dataset.o);});

/* ---------- 勝利條件與結局：劇本目標、稱帝、天下大勢結算 ---------- */
const END_YEAR=250;
/* 劇本目標：依開局城數決定，達成後可得「霸業初成」，未達成不影響遊戲 */
function makeGoal(f){const n=citiesOf(f).length;const sc=SCENARIOS.find(x=>x.id===S.scn);return{cities:Math.min(Object.keys(S.cities).length,Math.max(6,n*2+2)),year:sc.year+15,done:false,failed:false};}
function goalText(){const g=S.goal;if(!g)return '';return `${g.year} 年前據有 ${g.cities} 座城`+(g.done?'（已達成）':g.failed?'（未能如期達成）':'');}
function checkGoal(){
 const g=S.goal;if(!g||g.done||g.failed||!S.player)return;
 if(citiesOf(S.player).length>=g.cities){g.done=true;loyAll(S.player,5);log(`霸業初成：如期據有 ${g.cities} 城，眾將士氣大振`,'good');pushEvent('霸業初成',`<p class="evt">${lordOf(S.player).name}於 ${S.year} 年據有 ${g.cities} 座城池，達成劇本目標。天下英雄，皆側目而視。</p><p class="hint">接下來可以爭取稱帝，或在 ${END_YEAR} 年的天下大勢結算中取得更高評價；當然，也可以繼續掃平群雄。</p>`);unlockAch('goal');}
 else if(S.year>g.year){g.failed=true;log(`未能在 ${g.year} 年前據有 ${g.cities} 城，劇本目標未達成`,'bad');}
}
/* 稱帝：城池達 13 座且傳國玉璽在手，群臣勸進 */
function hasSeal(f){const it=(S.items||[]).find(i=>i.name==='傳國玉璽');if(!it)return false;if(it.owner!=null)return S.officers[it.owner].fac===f;return it.fac===f;}
function checkEmperor(){
 const F=S.factions[S.player];if(!F||!F.alive||F.emperor||S.evDone.chanhan)return;
 if(citiesOf(S.player).length<13||!hasSeal(S.player))return;
 if((S.evDone.jinjin||0)>S.turn)return;S.evDone.jinjin=S.turn+36;
 const L=lordOf(S.player);
 pushEvent('群臣勸進',`<p class="evt">群臣上表：「天命不可以久稽，神器不可以久曠。」${L.name}據有十三州郡之地，又得傳國玉璽，眾人請即皇帝位。</p>`+hz('漢末群雄中，袁術 197 年僭號最早而速亡；曹丕 220 年受禪、劉備 221 年稱帝、孫權 229 年稱帝，三國鼎立於焉成形。稱帝可以凝聚人心，也會成為眾矢之的。'),
  [{label:'即皇帝位（全軍忠誠 +10，諸侯友好 −15）',primary:true,fn:()=>{F.emperor=true;loyAll(S.player,10);Object.keys(S.factions).forEach(x=>{if(x!==S.player)adjTrust(S.player,x,-15);});log(`${L.name}登基稱帝，改元建號`,'good');unlockAch('emperor');checkTitles();}},
   {label:'時機未到，再三辭讓',fn:()=>{log(`${L.name}辭讓帝位，群臣三年後再勸`);}}]);
}
/* 天下大勢結算：END_YEAR 一月，依版圖、人才、人口、民忠、稱帝與劇本目標評分 */
function settleScore(f){
 const cs=citiesOf(f),tot=Object.keys(S.cities).length;
 const s={cities:cs.length*100,offs:S.officers.filter(o=>o.fac===f).length*8,pop:Math.round(cs.reduce((a,c)=>a+c.pop,0)/20000),ppl:Math.round(cs.reduce((a,c)=>a+(c.ppl??60),0)/Math.max(1,cs.length))*3,emperor:S.factions[f].emperor?500:0,goal:S.goal&&S.goal.done&&f===S.player?300:0};
 s.total=Object.values(s).reduce((a,b)=>a+b,0);s.share=cs.length/tot;return s;
}
function rankOf(s){return s.share>=0.6?'S':s.share>=0.4?'A':s.share>=0.25?'B':s.share>=0.12?'C':'D';}
function checkSettle(){
 if(S.over||S.settled||S.year<END_YEAR)return;
 S.settled=true;
 const rows=Object.values(S.factions).filter(x=>x.alive).map(x=>({x,s:settleScore(x.id)})).sort((a,b)=>b.s.total-a.s.total);
 const me=rows.find(r=>r.x.id===S.player);const rk=me?rankOf(me.s):'D';const pos=rows.findIndex(r=>r.x.id===S.player)+1;
 const verdict={S:'天下歸心，霸業已成，史書當以本朝紀年。',A:'雄踞一方，與群雄鼎足而立，足以名垂青史。',B:'割據一隅，進退有據，尚可再圖天下。',C:'偏安一方，力保不失，仍需勵精圖治。',D:'勢單力孤，僅存宗廟，後人為之歎息。'}[rk];
 const tbl=`<table class="ed sim"><thead><tr><th>勢力</th><th>城</th><th>將</th><th>總分</th><th>評等</th></tr></thead><tbody>${rows.slice(0,8).map(r=>`<tr${r.x.id===S.player?' style="font-weight:700"':''}><td><span class="dot" style="background:${r.x.color}"></span>${r.x.name}${r.x.emperor?'（帝）':''}</td><td class="num">${citiesOf(r.x.id).length}</td><td class="num">${S.officers.filter(o=>o.fac===r.x.id).length}</td><td class="num">${r.s.total}</td><td>${rankOf(r.s)}</td></tr>`).join('')}</tbody></table>`;
 unlockAch('settle'+rk);if(me)cloudScore(me.s,rk);
 modal(`${END_YEAR} 年　天下大勢`,`<p class="evt">歲月流轉，群雄逐鹿三十餘年。${me?`${S.factions[S.player].name}軍名列第 ${pos}，評等 <b>${rk}</b>。${verdict}`:''}</p>${tbl}<p class="hint">評等依版圖比例：六成以上 S、四成 A、二成五 B、一成二 C。總分另計武將、人口、民忠、稱帝與劇本目標。</p>`,
  [{label:'留在地圖，繼續遊戲',primary:true},{label:'本局列傳',fn:()=>{setTimeout(openBiography,0);}},{label:'戰績卡',fn:()=>{setTimeout(openShareCard,0);}},...(CLOUD.state==='on'?[{label:'排行榜',fn:()=>{setTimeout(openLeaderboard,0);}}]:[]),{label:'重新開始',fn:showStart}]);
 $('#modal .dlg').classList.add('wide');
}

function skillMod(B,u,t,cmd){
 let m=1;const a=uskill(u),d=uskill(t);
 if(cmd==='charge'){if(a==='shenwei')m*=1.25;if(a==='wushuang')m*=1.35;if(a==='jinfan'||a==='mengjiang')m*=1.15;}
 if(cmd==='volley'){if(a==='laodang')m*=1.3;if(a==='shenshe')m*=1.2;}

 if(cmd==='counter'){if(a==='huwei')m*=1.4;if(a==='longdan')m*=1.3;}
 if(d==='tongyu')m*=0.9;if(d==='tiebi'&&t.side==='d')m*=0.7;

function afterCharge(B,u,t){
 if(t.dead)return;
 if(hasSkill(u,'paoxiao')&&!confImmune(t)&&Math.random()<0.3){t.conf=B.map?1:(t.acted?1:2);bl(B,`${u.name}陣前咆哮，${t.name}隊陷入混亂`,'hit');}

function siegeTick(B){const lim=B.map?10:7;if(B.day>lim&&!B.over){B.morale.d=clamp(B.morale.d-2,0,100);if(!B.siegeWarn){B.siegeWarn=1;bl(B,`${B.city}被圍多日，城中糧草將盡，守軍士氣動搖`,'bad');}}}
/* 伏兵：在森林裡且身旁沒有敵軍的部隊，敵方看不見也無法選為目標 */
function hiddenAt(B,u){return B.map&&u.pos&&B.T[hk(...u.pos)]==='forest'&&!nbrs(...u.pos).some(([a,b])=>{const x=unitAt(B,a,b);return x&&x.side!==u.side;});}
function visibleFoes(B,side){return alive(B,otherSide(side)).filter(f=>!hiddenAt(B,f));}
/* 火計：B.fire[格]=剩餘燃燒日。可對三格內的平原、森林、丘陵放火；雨天不可 */
function fireTargets(B,u){if(B.wx==='rain')return[];const out=[];for(let r=0;r<MH;r++)for(let c=0;c<MW;c++){const k=hk(c,r);if(!['plain','forest','hill'].includes(B.T[k])&&!(B.naval&&B.T[k]==='river'&&unitAt(B,c,r)))continue;if(hdist(u.pos,[c,r])>3||hdist(u.pos,[c,r])===0)continue;if(B.fire&&B.fire[k])continue;const x=unitAt(B,c,r);if(x&&x.side===u.side)continue;out.push(k);}return out;}
function fireDmg(B,k,u,src){const t=B.T[k];const base=u.troops*(t==='forest'?0.16:t==='hill'?0.1:B.naval&&t==='river'?0.2:0.08)*(B.wx==='wind'?1.3:1);return hurt(B,u,base*(src&&hasSkill(src,'huoshen')?1.4:1),false);}
function setFire(B,u,k){
 B.fire=B.fire||{};const O=u.off!=null?S.officers[u.off]:null;
 const p=clamp(0.45+u.int/200+(B.wx==='wind'?0.15:0),0.1,0.95);
 if(Math.random()>=p){bl(B,`${u.name}放火未能燃起`);return{ok:false};}
 B.fire[k]=B.T[k]==='forest'?3:B.naval&&B.T[k]==='river'?1:2;gainExp(O,'int',10);
 const x=unitAt(B,...pk(k));let d=0;if(x){d=fireDmg(B,k,x,u);if(u.side===(S.player===B.f?'a':'d')&&S.player)stat('fireHits');if(!x.dead&&!confImmune(x))x.conf=1;}
 bl(B,`${u.name}於${TER[B.T[k]].n}放火${x?`，${x.name}隊被烈焰吞噬，折損 ${fmt(d)}，陷入混亂`:''}`,'hit');
 return{ok:true,dmg:d};
}
function fireTick(B){
 if(!B.fire)return;
 if(B.wx==='rain'){if(Object.keys(B.fire).length)bl(B,'大雨傾盆，火勢盡熄');B.fire={};return;}
 const next={};
 for(const k in B.fire){
  const x=unitAt(B,...pk(k));if(x){const d=fireDmg(B,k,x);bl(B,`${x.name}隊身陷火場，折損 ${fmt(d)}`,'bad');}
  const left=B.fire[k]-1;if(left>0)next[k]=left;
  const pr=B.wx==='wind'?0.5:0.22;
  nbrs(...pk(k)).forEach(([a,b])=>{const nk=hk(a,b);const t=B.T[nk];if((t==='forest'||(t==='hill'&&B.wx==='wind'))&&!B.fire[nk]&&!next[nk]&&Math.random()<pr){next[nk]=t==='forest'?3:2;const y=unitAt(B,a,b);if(y){const d=fireDmg(B,nk,y);bl(B,`火勢蔓延至${y.name}隊，折損 ${fmt(d)}`,'bad');}}});
 }
 B.fire=next;
}

/* ---------- 地圖縮放與拖曳（滑鼠滾輪、拖曳、雙指縮放），大地圖與戰場共用 ---------- */
const ZOOM={map:{W:MAPVW,H:MAPVH,x:0,y:0,s:1},bmap:{W:MAPW,H:MAPH,x:0,y:0,s:1},suppress:false,pts:new Map(),drag:null};
function zoomApply(id){
 const z=ZOOM[id],svg=document.getElementById(id);if(!svg)return;
 z.s=clamp(z.s,1,4);const w=z.W/z.s,h=z.H/z.s;z.x=clamp(z.x,0,z.W-w);z.y=clamp(z.y,0,z.H-h);
 svg.setAttribute('viewBox',`${z.x.toFixed(1)} ${z.y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
 const wrap=svg.parentElement;if(wrap&&!wrap.querySelector('.zoomctl')){const d=document.createElement('div');d.className='zoomctl';d.innerHTML=`<button data-z="in" aria-label="放大">＋</button><button data-z="out" aria-label="縮小">－</button><button data-z="reset" aria-label="重設">⟲</button>`;d.addEventListener('click',e=>{const b=e.target.closest('[data-z]');if(!b)return;e.stopPropagation();const k=b.dataset.z;if(k==='reset'){z.s=1;z.x=0;z.y=0;}else zoomAt(id,k==='in'?1.4:1/1.4,null);zoomApply(id);});wrap.appendChild(d);}
}
function zoomAt(id,f,pt){
 const z=ZOOM[id];const ns=clamp(z.s*f,1,4);if(ns===z.s)return;
 const w0=z.W/z.s,h0=z.H/z.s,w1=z.W/ns,h1=z.H/ns;
 const px=pt?pt.x:0.5,py=pt?pt.y:0.5;
 z.x=z.x+(w0-w1)*px;z.y=z.y+(h0-h1)*py;z.s=ns;
}
function zoomRel(svg,e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,r};}
function zoomTarget(e){const svg=e.target.closest&&e.target.closest('svg#map,svg#bmap');return svg?svg.id:null;}
document.addEventListener('wheel',e=>{const id=zoomTarget(e);if(!id)return;e.preventDefault();const svg=document.getElementById(id);const p=zoomRel(svg,e);zoomAt(id,e.deltaY<0?1.15:1/1.15,p);zoomApply(id);},{passive:false});
document.addEventListener('pointerdown',e=>{const id=zoomTarget(e);if(!id)return;ZOOM.pts.set(e.pointerId,{x:e.clientX,y:e.clientY,id});if(ZOOM.pts.size===1)ZOOM.drag={id,x:e.clientX,y:e.clientY,moved:false};});
document.addEventListener('pointermove',e=>{
 if(!ZOOM.pts.has(e.pointerId))return;const prev=ZOOM.pts.get(e.pointerId);ZOOM.pts.set(e.pointerId,{x:e.clientX,y:e.clientY,id:prev.id});
 const id=prev.id,z=ZOOM[id],svg=document.getElementById(id);if(!svg)return;const r=svg.getBoundingClientRect();
 if(ZOOM.pts.size===2){const[a,b]=[...ZOOM.pts.values()];if(!ZOOM.pinch){ZOOM.pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:z.s};}
  const d=Math.hypot(a.x-b.x,a.y-b.y);const mid={x:((a.x+b.x)/2-r.left)/r.width,y:((a.y+b.y)/2-r.top)/r.height};const f=(ZOOM.pinch.s*d/ZOOM.pinch.d)/z.s;zoomAt(id,f,mid);zoomApply(id);ZOOM.drag&&(ZOOM.drag.moved=true);return;}
 if(ZOOM.drag&&ZOOM.drag.id===id&&ZOOM.pts.size===1){const dx=e.clientX-prev.x,dy=e.clientY-prev.y;if(Math.hypot(e.clientX-ZOOM.drag.x,e.clientY-ZOOM.drag.y)>8)ZOOM.drag.moved=true;if(ZOOM.drag.moved&&z.s>1){z.x-=dx*(z.W/z.s)/r.width;z.y-=dy*(z.H/z.s)/r.height;zoomApply(id);}}
});
function zoomEnd(e){if(!ZOOM.pts.has(e.pointerId))return;ZOOM.pts.delete(e.pointerId);if(ZOOM.pts.size<2)ZOOM.pinch=null;if(ZOOM.pts.size===0){if(ZOOM.drag&&ZOOM.drag.moved)ZOOM.suppress=true;ZOOM.drag=null;}}
document.addEventListener('pointerup',zoomEnd);document.addEventListener('pointercancel',zoomEnd);
document.addEventListener('click',e=>{if(ZOOM.suppress){ZOOM.suppress=false;if(zoomTarget(e)){e.stopPropagation();e.preventDefault();}}},true);

/* 音效：Web Audio 合成，不用外部檔案。首次使用者操作後才建立 AudioContext */
let AC=null;
function sfxOn(){return PREF.get('sfx','on')==='on';}
function sfx(name){
 if(!sfxOn())return;
 try{
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();}
  if(AC.state==='suspended')AC.resume();
  const t=AC.currentTime;const g=AC.createGain();g.connect(AC.destination);
  const tone=(f,d,type,vol,at)=>{const o=AC.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f,t+(at||0));const gg=AC.createGain();gg.gain.setValueAtTime(0,t+(at||0));gg.gain.linearRampToValueAtTime(vol||0.15,t+(at||0)+0.01);gg.gain.exponentialRampToValueAtTime(0.001,t+(at||0)+d);o.connect(gg);gg.connect(g);o.start(t+(at||0));o.stop(t+(at||0)+d+0.05);};
  const noise=(d,vol,lp)=>{const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate);const data=b.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp||1200;const gg=AC.createGain();gg.gain.value=vol||0.2;s.connect(fl);fl.connect(gg);gg.connect(g);s.start(t);};
  switch(name){
   case 'attack':noise(0.18,0.25,2000);tone(160,0.12,'square',0.08);break;
   case 'volley':for(let i=0;i<4;i++)tone(900-i*120,0.08,'triangle',0.06,i*0.05);break;
   case 'siege':noise(0.35,0.35,400);tone(70,0.3,'sine',0.25);break;
   case 'duel':tone(660,0.12,'square',0.1);tone(880,0.12,'square',0.1,0.13);noise(0.12,0.15,3000);break;
   case 'strat':tone(520,0.25,'sine',0.1);tone(780,0.3,'sine',0.08,0.1);break;
   case 'win':[523,659,784,1047].forEach((f,i)=>tone(f,0.35,'triangle',0.12,i*0.12));break;
   case 'lose':[392,330,262].forEach((f,i)=>tone(f,0.4,'triangle',0.12,i*0.18));break;
   case 'month':tone(880,0.4,'sine',0.06);tone(1320,0.5,'sine',0.04,0.05);break;
   case 'event':tone(1047,0.6,'sine',0.08);tone(1568,0.8,'sine',0.05,0.02);break;
   case 'unlock':[784,988,1175,1568].forEach((f,i)=>tone(f,0.25,'sine',0.1,i*0.08));break;
  }
 }catch(e){}
}

function openTimeline(){
 const D=S.evDone||{};
 const rows=TIMELINE.map(([y,t,z,k,div])=>{const done=k&&D[k];const past=y<=S.year;let d=null;try{d=div?div():null;}catch(e){}
  return `<tr class="${past?'':'future'}"><td class="num">${y}</td><td><b>${t}</b>${done?' <span class="tag">本局已發生</span>':k&&past?' <span class="tag off">本局未發生</span>':''}${d?`<br><small class="bad">分歧：${d}</small>`:''}<br><small>${z}</small></td></tr>`;}).join('');
 modal('三國大事年表',`<p class="hint">現在是 ${S.year} 年。灰色為尚未到來的年份；「本局已發生」表示本局觸發了對應事件，「分歧」表示你這一局已與史實不同。</p><div class="edlist"><table class="ed tl"><tbody>${rows}</tbody></table></div>`,[{label:'隨堂測驗',fn:()=>{setTimeout(()=>openQuiz(),0);}},{label:'本局列傳',fn:()=>{setTimeout(openBiography,0);}},{label:'關閉',primary:true}]);
 $('#modal .dlg').classList.add('wide');
}

/* ---------- 水戰：長江、海路沿線的戰鬥改用水戰規則 ---------- */
/* 走這些道路出征即為水戰（B.naval=true）：戰場大半是水面、船行水上一格一步、火攻威力加倍、北方兵暈船 */
const NAVAL_EDGES=['江陵-江夏','江夏-柴桑','柴桑-建業','壽春-柴桑','柴桑-長沙','下邳-建業','汝南-江夏','建業-吳','吳-會稽','江夏-長沙','永安-江陵','樂浪-邪馬台','北海-邪馬台','番禺-會稽','會稽-夷洲','番禺-夷洲'];
function isNaval(a,b){return NAVAL_EDGES.includes(a+'-'+b)||NAVAL_EDGES.includes(b+'-'+a);}
function navalSeasick(B,u){if(!B.naval||u.side!=='d')return false;const src=S.cities[B.src];return src&&regionOf(src)==='north'&&!hasTrait(ufac(B,u),'seafarer');}
/* 傷害修正：水戰時北方攻方 −20%（水土不服、暈船），火計與計略 +30%；「渡海之民」不受暈船影響 */
function navalMod(B,u,t,cmd){
 if(!B.naval)return 1;let m=1;
 if(u.side==='a'){const src=S.cities[B.src];if(src&&regionOf(src)==='north'&&!hasTrait(ufac(B,u),'seafarer')&&(cmd==='charge'||cmd==='volley'))m*=0.8;}
 if(cmd==='strat')m*=1.3;
 return m;
}
/* 戰場：城在一側，其餘大半為水面；水面對船隻而言是平地，岸邊留一圈灘地 */
function navalMap(B,L){
 const T=B.T;const core=B.core;
 for(const k in T){const t=T[k];if(['core','city','wall','gate','breach'].includes(t))continue;const d=hdist(pk(k),core);T[k]=d<=3?'plain':'river';}
 L.spawn.forEach(p=>{T[hk(...p)]='river';});
 bl(B,`${B.city}之戰為水戰：船行水上如履平地，火攻威力倍增，北方士卒不習水戰`);
}
function navalCost(B,t){return B.naval&&t==='river'?1:null;}
function navalDef(B,t){return B.naval&&t==='river'?1:null;}
/* 船艦：攻方依統率配樓船（統率 ≥80）或艨艟，顯示用；樓船齊射 +15%，艨艟移動 +1 */
function shipOf(u){return u.lea>=80?'樓船':'艨艟';}
function shipMod(B,u,cmd){if(!B.naval)return 1;return cmd==='volley'&&shipOf(u)==='樓船'?1.15:1;}
function shipMv(B,u){return B.naval&&shipOf(u)==='艨艟'?1:0;}

/* ---------- 電腦勢力的策略層：合縱抗強、守勢判斷、集中兵力 ---------- */
/* 霸主：城數佔三成五以上的勢力。其他電腦勢力會互相結盟並以霸主為共同目標 */
function hegemon(){const tot=Object.keys(S.cities).length;const al=Object.values(S.factions).filter(x=>x.alive);const top=al.sort((a,b)=>citiesOf(b.id).length-citiesOf(a.id).length)[0];return top&&citiesOf(top.id).length/tot>=0.35?top.id:null;}
/* 城池受威脅：相鄰敵城兵力合計超過本城守軍的 1.2 倍 */
/* 只看單一最強的相鄰敵城：其兵力超過本城 1.6 倍才算受威脅（總和會讓幾乎每座城都不敢出兵） */
function threatened(c,f){const enemy=ADJ[c.name].map(n=>S.cities[n]).filter(t=>t.owner&&t.owner!==f&&!friendly(f,t.owner)).reduce((a,t)=>Math.max(a,t.troops),0);return enemy>c.troops*1.6;}
/* 出兵評估的策略修正：霸主目標 ×1.3；霸主自身更謹慎 ×0.85；受威脅的城不出兵 */
function aiStrategyMod(f,c,t){
 if(threatened(c,f))return 0.5;
 const h=hegemon();let m=1;
 if(h&&t.owner===h&&f!==h)m*=1.3;
 if(h===f)m*=0.85;
 if(t.owner&&S.factions[t.owner]&&citiesOf(t.owner).length===1)m*=1.15;
 return m;
}
/* 合縱：非霸主的電腦勢力之間，若都與霸主接壤，更容易結盟並約定共同出兵 */
function aiCoalition(){
 const h=hegemon();if(!h)return;
 const al=Object.values(S.factions).filter(x=>x.alive&&x.id!==h&&x.id!==S.player&&borders(x.id,h)).map(x=>x.id);
 for(let i=0;i<al.length;i++)for(let j=i+1;j<al.length;j++){const a=al[i],b=al[j];const r=rel(a,b);
  if(!r.ally&&r.trust>=30&&Math.random()<0.12){r.ally=true;r.trust=clamp(r.trust+15,0,100);log(`${S.factions[a].name}與${S.factions[b].name}合縱結盟，共抗${S.factions[h].name}`);}
  if(r.ally&&(!r.focus||r.focusUntil<=S.turn)){r.focus=h;r.focusUntil=S.turn+6;r.focusBy=a;}}
 if(h===S.player&&Math.random()<0.02)log('諸侯忌憚我軍勢大，暗中合縱','bad');
}
/* 集中兵力：出兵前把後方閒置兵力調到出發城 */
function aiConcentrate(f,c){
 for(const n of ADJ[c.name]){const b=S.cities[n];if(b.owner!==f||isFront(b,f)||b.troops<6000)continue;const amt=Math.round((b.troops-3000)*0.6);if(amt>1000){doMove(b,c,[],amt);}}
}

/* ---------- 繼承事件與多人熱座 ---------- */
/* 人類玩家：熱座模式下 S.hot 是輪流操作的勢力清單，S.player 是現在操作的那一位 */
function isHuman(f){return !!f&&(S.hot?S.hot.includes(f):f===S.player);}
const SPLIT_COLORS=['#8A5A9C','#5A8A9C','#9C8A5A','#5A9C6A','#9C5A5A','#6A6A9C'];
function splitOff(F,rival){
 const cs=citiesOf(F.id).filter(c=>c.name!==lordOf(F.id).city);if(!cs.length||!rival)return false;
 const city=cs.sort((a,b)=>b.troops-a.troops)[0];const id=F.id+'_'+rival.id;if(S.factions[id])return false;
 newFaction(id,rival.name,rival,[city.name],[]);S.factions[id].color=SPLIT_COLORS[Object.keys(S.factions).length%SPLIT_COLORS.length];rival.city=city.name;
 const r=rel(F.id,id);r.trust=10;
 log(`${rival.name}不服，據${city.name}自立，${F.name}勢力分裂`,isHuman(F.id)?'bad':'');return true;
}
/* 君主死後：候選人兩位以上時，人類玩家選擇繼承人；電腦勢力有機率分裂 */
function succession(F,cands){
 if(cands.length<2)return;
 const prev=cands[0];
 if(isHuman(F.id)){
  const t=hz('袁紹廢長立幼，死後袁譚、袁尚兄弟相攻，河北為曹操所乘；孫權晚年太子孫和與魯王孫霸「二宮之爭」，朝臣分裂。繼承人之爭往往比外敵更致命。');
  pushEvent(`${F.name}軍　繼承人之爭`,`<p class="evt">君主辭世，群臣議立新主。依序位當立${prev.name}；另立他人可能招致內亂。</p>`+t,
   cands.slice(0,3).map((c,i)=>({label:`${c.name}（統${c.lea} 武${c.war} 智${c.int} 政${c.pol} 魅${c.cha}）${i===0?'　序位當立':''}`,primary:i===0,fn:()=>{F.lord=c.id;c.loy=100;S.officers.filter(o=>o.fac===F.id&&o!==c).forEach(o=>o.loy=clamp((o.loy||70)-(i===0?0:8),0,100));log(`${c.name}繼位為${F.name}軍之主`,'good');if(i>0&&Math.random()<0.4)splitOff(F,prev);checkTitles();}})));
 }else if(citiesOf(F.id).length>=4&&Math.random()<0.25)splitOff(F,cands[1]);
}

/* endTurn 的熱座分支：還有人沒下令就換人；全部下完才讓電腦行動並推進月份 */
function hotEndTurn(){

 S.hotDone=S.hotDone||{};S.hotDone[S.player]=true;

 for(const f of shuffle(Object.keys(S.factions))){if(isHuman(f)||!S.factions[f].alive)continue;aiTurn(f);}
 const order=alive.slice();
 const step=i=>{
  if(i>=order.length){S.player=order[0];checkFactions();render();if(checkEnd())return;const prevDate=dateStr();advanceMonth();monthlySummary(prevDate);checkAch();sfx('month');render();hotSwitch(order[0],`${eraStr()}，新的一個月。`);return;}
  S.player=order[i];render();
  const mine=S.incoming.filter(it=>S.cities[it.t].owner===S.player);
  if(!mine.length){step(i+1);return;}
  const rest=S.incoming.filter(it=>S.cities[it.t].owner!==S.player);S.incoming=mine;
  modal('換人',`<p class="evt"><span class="dot" style="background:${S.factions[S.player].color}"></span><b>${S.factions[S.player].name}軍</b>的城池遭到進攻，請該玩家指揮守城。</p>`,[{label:'開始',primary:true,fn:()=>{runIncoming(()=>{S.incoming=rest;processCaptives(()=>step(i+1));});}}]);
 };
 step(0);
 return true;
}

/* 背景音樂：五聲音階生成，Web Audio 合成；戰鬥時節奏加快 */
const MUSIC={on:false,timer:null,step:0,battle:false};
const PENTA=[0,2,4,7,9,12,14,16];
function musicOn(){return PREF.get('music','off')==='on';}
function musicNote(semi,dur,vol,type){if(!AC)return;const f=196*Math.pow(2,semi/12);const o=AC.createOscillator();o.type=type||'sine';o.frequency.value=f;const g=AC.createGain();const t=AC.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.03);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.05);}
function musicTick(){
 if(!MUSIC.on)return;
 try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();}if(AC.state==='suspended')AC.resume();
  const b=MUSIC.battle;const beat=b?0.28:0.55;MUSIC.step++;
  const s=MUSIC.step;const R=seeded('m'+Math.floor(s/16));let deg=0;for(let i=0;i<(s%16)+1;i++)deg=clamp(deg+Math.round((R()-0.5)*3),0,PENTA.length-1);
  if(s%2===0||b)musicNote(PENTA[deg]+(b?-12:0),beat*1.8,b?0.05:0.04,b?'triangle':'sine');
  if(s%8===0)musicNote(PENTA[0]-24,beat*4,0.05,'sine');
  if(b&&s%4===0)musicNote(-24,0.12,0.06,'square');
  MUSIC.timer=setTimeout(musicTick,beat*1000);
 }catch(e){}
}
function musicStart(){if(MUSIC.on||!musicOn())return;MUSIC.on=true;musicTick();}
function musicStop(){MUSIC.on=false;clearTimeout(MUSIC.timer);}
document.addEventListener('click',()=>{if(musicOn())musicStart();},{once:false});

function cn(n){return n>=10?cnNum(n):cnNum(n);}
function bioLine(o){const b=BIO[o.name];if(!b||!b.z)return '';const s=b.z.split('。')[0];return s?s+'。':'';}
function lordBiography(){
 const f=S.player,F=S.factions[f],L=lordOf(f),sc=SCENARIOS.find(x=>x.id===S.scn);
 const ch=(S.chron||[]);const cs=citiesOf(f);
 const wins=ch.filter(x=>/攻陷/.test(x[2])&&x[2].startsWith(F.name)).length,losses=ch.filter(x=>/失利|大敗/.test(x[2])&&x[2].startsWith(F.name)).length;
 const taken=ch.filter(x=>/攻陷/.test(x[2])&&x[2].startsWith(F.name)).map(x=>x[2].replace(/^.*攻陷/,'')).slice(0,8);
 const joined=ch.filter(x=>/歸順|出仕|來投|出山|加入麾下|願意出仕/.test(x[2])).map(x=>x[2].match(/^([一-鿿]{2,4})/)?.[1]).filter(Boolean).slice(0,6);
 const allies=Object.values(S.factions).filter(x=>x.alive&&x.id!==f&&rel(f,x.id).ally).map(x=>x.name);
 const yrs=S.year-sc.year;const title=F.emperor?'帝':lordTitle(f);
 let t=`<h3>${L.name}${F.emperor?'本紀':'傳'}</h3>`;
 t+=`<p class="evt">${L.name}${bioLine(L)?'，'+bioLine(L).replace(/^字/,'字'):'。'}${sc.year}年${sc.month}月，${sc.title}之際，${L.name}據${citiesOf(f).length?cs[0].name:'一隅'}而起，時有城${cn(S.startCities||cs.length)}。`;
 t+=taken.length?`其後${yrs}年間，${wins}戰克捷，${losses}戰失利，先後略定${taken.join('、')}${taken.length>=8?'等地':''}。`:`${yrs}年間，攻戰${wins+losses}，未嘗拓土。`;
 t+=joined.length?`${joined.join('、')}相繼來歸。`:'';
 t+=allies.length?`與${allies.join('、')}結盟。`:'';
 t+=F.emperor?`後受群臣勸進，即皇帝位。`:`官至${title}。`;
 t+=S.over&&!F.alive?`${S.year}年，勢力覆滅。`:`至${S.year}年，據有${cs.length}城，麾下將佐${S.officers.filter(o=>o.fac===f).length}人。`;
 t+=`</p>`;
 const top=S.officers.filter(o=>o.fac===f&&!isLord(o)).sort((a,b)=>(b.merit||0)-(a.merit||0)).slice(0,5);
 if(top.length){t+=`<h3>功臣列傳</h3>`;top.forEach(o=>{const sk=skillName(o);t+=`<p class="evt"><b>${o.name}</b>${bioLine(o)?'，'+bioLine(o):'。'}事${L.name}，官至${rankName(o)}，功績${o.merit||0}${sk?'，以「'+sk+'」聞名軍中':''}。${o.loy>=90?'忠貞不貳。':o.loy<60?'然常懷去志。':''}</p>`;});}
 const sc2=settleScore(f),rk=rankOf(sc2);
 const ping={S:'席捲宇內，混一區夏，雖古之聖王，何以加焉。',A:'雄據一方，與群雄鼎足，可謂一世之傑矣。',B:'保境安民，進取有度，亦足以垂名。',C:'偏安一隅，守成而已，惜其未能大用。',D:'勢單力弱，僅存宗廟，其亦時命之不濟歟。'}[rk];
 t+=`<h3>評曰</h3><p class="evt">${L.name}${ping}</p><p class="hint">本傳由本局發生的事件自動生成，仿《三國志》體例。</p>`;
 return t;
}

 const W=1200,H=630,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');

 g.fillStyle='rgba(0,0,0,.06)';for(let i=0;i<40;i++){g.fillRect(rnd(0,W),rnd(20,H-20),rnd(2,6),rnd(2,6));}
 const svg=portrait(L,200,{col:F.color,lord:true}).replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ');const img=new Image();

 try{g.drawImage(img,70,150,300,300);}catch(e){}

 g.font='400 30px "Noto Serif TC",serif';g.fillStyle='#262A22';
 const lines=[`${eraStr()}　${F.emperor?'皇帝':lordTitle(f)}`,`城池 ${cs.length}／${Object.keys(S.cities).length}　武將 ${S.officers.filter(o=>o.fac===f).length} 人　人口 ${wan(cs.reduce((a,c)=>a+c.pop,0))}`,`總分 ${s.total}　評等 ${rk}${S.goal&&S.goal.done?'　劇本目標達成':''}`];
 lines.forEach((l,i)=>g.fillText(l,420,300+i*48));
 g.font='900 160px "Noto Serif TC",serif';g.fillStyle=F.color;g.globalAlpha=.85;g.fillText(rk,1000,470);g.globalAlpha=1;
 g.font='400 22px "Noto Serif TC",serif';g.fillStyle='#666B5F';g.fillText('qunxiong-zhulu.vercel.app',420,560);
 const url=cv.toDataURL('image/png');
 modal('戰績卡',`<img src="${url}" alt="戰績卡" style="width:100%;max-width:720px;display:block;border:1px solid var(--line)"><p class="hint">長按或右鍵可儲存圖片。</p>`,[{label:'複製圖片',fn:()=>{cv.toBlob(async b=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('已複製圖片');}catch(e){toast('這個瀏覽器不支援複製圖片，請長按儲存');}});return false;}},{label:'下載',fn:()=>{const a=document.createElement('a');a.href=url;a.download=`群雄逐鹿-${F.name}-${S.year}.png`;a.click();return false;}},{label:'關閉',primary:true}]);
 $('#modal .dlg').classList.add('wide');
